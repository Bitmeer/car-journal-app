<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #map { position: absolute; inset: 0; }
    .leaflet-control-attribution { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', { zoomControl: true }).setView([55.7558, 37.6173], 13);

    var osmLayer = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
      { maxZoom: 19, subdomains: 'abcd' }
    ).addTo(map);

    var satLayer = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19 }
    );
    var satLabels = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19 }
    );

    var isSat = false;
    var userMarker = null;
    var stations = [];

    function setUserLocation(lat, lon) {
      map.setView([lat, lon], 15);
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat, lon], {
        radius: 11, fillColor: '#4285F4', color: '#fff', weight: 3, fillOpacity: 1
      }).addTo(map).bindPopup('<b>Вы здесь</b>').openPopup();
    }

    function clearStations() {
      stations.forEach(function(m) { map.removeLayer(m); });
      stations = [];
    }

    function addStation(lat, lon, name, brand) {
      var lbl = name || 'АЗС';
      var popup = '<b>' + lbl + '</b>' + (brand && brand !== '' ? '<br><small>' + brand + '</small>' : '');
      var m = L.circleMarker([lat, lon], {
        radius: 9, fillColor: '#e74c3c', color: '#fff', weight: 2, fillOpacity: 0.9
      }).addTo(map).bindPopup(popup);
      stations.push(m);
    }

    function switchLayer(type) {
      if (type === 'satellite' && !isSat) {
        map.removeLayer(osmLayer);
        satLayer.addTo(map);
        satLabels.addTo(map);
        isSat = true;
      } else if (type === 'map' && isSat) {
        satLayer.remove();
        satLabels.remove();
        osmLayer.addTo(map);
        isSat = false;
      }
    }

    function goToUser() {
      if (userMarker) map.setView(userMarker.getLatLng(), 15);
    }
  </script>
</body>
</html>
